name: Sync T-Mobile bill to Splitwise

on:
  schedule:
    # Daily at 15:00 UTC (~8am Pacific). Safe to run every day: findLatestBill() only matches
    # emails from the last 10 days, and getExistingExpenseTitles() skips anything already
    # posted, so most days this is a quick no-op until a new bill actually shows up.
    - cron: "0 15 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Reconstruct gitignored config/credentials from secrets
        env:
          SPLITWISE_API_KEY: ${{ secrets.SPLITWISE_API_KEY }}
          GMAIL_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          PEOPLE_CONFIG_JSON: ${{ secrets.PEOPLE_CONFIG_JSON }}
        run: |
          echo "SPLITWISE_API_KEY=$SPLITWISE_API_KEY" > .env
          echo "$GMAIL_CLIENT_SECRET_JSON" > client_secret.json
          echo "$GMAIL_TOKEN_JSON" > token.json
          echo "$PEOPLE_CONFIG_JSON" > config/people.json

      - name: Run sync
        run: npm run sync -- --yes
